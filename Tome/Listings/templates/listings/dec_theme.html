<style>
    :root, .theme-dark, .theme- {
        --bg-gradient-start: #0f172a;
        --bg-gradient-end: #1e293b;
        --text-primary: #e2e8f0;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        --border-color: rgba(148, 163, 184, 0.2);
        --card-bg: rgba(30, 41, 59, 0.8);
        --card-bg-hover: rgba(59, 130, 246, 0.08);
        --accent-primary: #3b82f6;
        --accent-secondary: #8b5cf6;
        --accent-light: #60a5fa;
        --input-bg: rgba(15, 23, 42, 0.65);
    }

    body.theme-light {
        --bg-gradient-start: #f8fafc;
        --bg-gradient-end: #e2e8f0;
        --text-primary: #0f172a;
        --text-secondary: #1e293b;
        --text-muted: #475569;
        --border-color: rgba(15, 23, 42, 0.18);
        --card-bg: rgba(255, 255, 255, 0.9);
        --card-bg-hover: rgba(59, 130, 246, 0.06);
        --accent-primary: #2563eb;
        --accent-secondary: #7c3aed;
        --accent-light: #2563eb;
        --input-bg: rgba(241, 245, 249, 0.9);
    }

    * {
        box-sizing: border-box;
    }

    body.theme-dark,
    body.theme-light,
    body.theme- {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        color: var(--text-primary);
        background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
    }

    a {
        color: var(--accent-light);
        text-decoration: none;
    }

    a:hover {
        color: var(--accent-primary);
    }

    .wrap,
    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1.5rem;
        margin-bottom: 2rem;
        padding-bottom: 1.5rem;
        border-bottom: 1px solid var(--border-color);
    }

    .header-left,
    .header-right,
    nav,
    .page-actions,
    .actions {
        display: flex;
        align-items: center;
        gap: 1rem;
    }

    .header-right,
    nav,
    .page-actions,
    .actions {
        flex-wrap: wrap;
    }

    .logo {
        color: var(--accent-primary);
        font-size: 1.8rem;
        font-weight: 700;
    }

    nav a {
        color: var(--text-secondary);
    }

    .page-title {
        margin-bottom: 1.5rem;
    }

    .page-title h1,
    h1 {
        margin: 0 0 0.5rem;
        color: var(--text-primary);
        font-size: 2rem;
        letter-spacing: 0;
        text-transform: none;
    }

    h2 {
        margin: 0 0 0.75rem;
        color: var(--text-primary);
        font-size: 1.2rem;
        letter-spacing: 0;
        text-transform: none;
    }

    p,
    small {
        color: var(--text-muted);
    }

    .badge,
    .chip {
        display: inline-block;
        margin-bottom: 1rem;
        padding: 0.3rem 0.55rem;
        border: 1px solid rgba(59, 130, 246, 0.45);
        border-radius: 8px;
        color: var(--accent-light);
        font-size: 0.85rem;
        font-weight: 600;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1rem;
    }

    .panel {
        margin-bottom: 1rem;
        padding: 1.25rem;
        overflow-x: auto;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background: var(--card-bg);
        color: var(--text-primary);
    }

    .instance-card,
    .meta > div {
        margin-bottom: 0.75rem;
        padding: 0.85rem;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background: var(--card-bg-hover);
    }

    .instance-card:last-child {
        margin-bottom: 0;
    }

    .meta {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 0.75rem;
        margin: 1rem 0;
    }

    .meta > div {
        margin: 0;
    }

    .messages,
    .page-actions {
        margin-bottom: 1rem;
    }

    .msg,
    .alert {
        margin-bottom: 0.5rem;
        padding: 0.75rem 0.9rem;
        border: 1px solid var(--border-color);
        border-left: 4px solid var(--accent-primary);
        border-radius: 8px;
        background: var(--card-bg);
        color: var(--text-secondary);
    }

    .actions {
        align-items: flex-end;
    }

    label {
        display: block;
        color: var(--text-secondary);
        font-size: 0.9rem;
    }

    input,
    select,
    button,
    .btn {
        min-height: 2.5rem;
        padding: 0.6rem 0.85rem;
        border-radius: 8px;
        font: inherit;
    }

    input,
    select {
        width: 100%;
        margin-top: 0.3rem;
        border: 1px solid var(--border-color);
        background: var(--input-bg);
        color: var(--text-primary);
    }

    button,
    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: auto;
        border: 1px solid transparent;
        background: var(--accent-primary);
        color: #ffffff;
        cursor: pointer;
        font-weight: 600;
    }

    button:hover,
    .btn:hover {
        background: var(--accent-secondary);
        color: #ffffff;
    }

    .btn-secondary {
        border-color: var(--border-color);
        background: transparent;
        color: var(--text-secondary);
    }

    .btn-secondary:hover {
        background: var(--card-bg-hover);
        color: var(--text-primary);
    }

    table {
        width: 100%;
        min-width: 680px;
        border-collapse: collapse;
        background: transparent;
        color: var(--text-primary);
    }

    th,
    td {
        padding: 0.7rem;
        border-bottom: 1px solid var(--border-color);
        text-align: left;
        vertical-align: top;
    }

    th {
        color: var(--text-muted);
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
    }

    code {
        display: block;
        padding: 0.75rem;
        overflow-wrap: anywhere;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background: var(--input-bg);
        color: var(--text-secondary);
    }

    .ok {
        color: #22c55e;
    }

    .bad {
        color: #f87171;
    }

    @media (max-width: 768px) {
        .wrap,
        .container {
            padding: 1.25rem;
        }

        header {
            align-items: flex-start;
            flex-direction: column;
        }

        .header-right,
        nav,
        .actions {
            align-items: stretch;
            width: 100%;
        }

        .actions label,
        .actions button,
        .actions input {
            width: 100%;
        }

        .page-title h1,
        h1 {
            font-size: 1.6rem;
        }
    }
</style>
