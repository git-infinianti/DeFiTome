<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Address Profile | DeFi Tome</title>
    <style>
        :root, .theme-dark, .theme- {
            --bg-gradient-start: #0f172a;
            --bg-gradient-end: #1e293b;
            --text-primary: #e2e8f0;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-color: rgba(148, 163, 184, 0.2);
            --card-bg: rgba(30, 41, 59, 0.8);
            --accent-primary: #3b82f6;
            --accent-secondary: #8b5cf6;
            --accent-light: #60a5fa;
            --accent-purple: #a78bfa;
            --success-text: #4ade80;
            --error-text: #fca5a5;
            --warning-text: #fcd34d;
            --input-bg: rgba(15, 23, 42, 0.5);
            --input-focus-bg: rgba(15, 23, 42, 0.7);
        }

        .theme-light {
            --bg-gradient-start: #f8fafc;
            --bg-gradient-end: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --border-color: rgba(15, 23, 42, 0.2);
            --card-bg: rgba(255, 255, 255, 0.9);
            --accent-primary: #3b82f6;
            --accent-secondary: #8b5cf6;
            --accent-light: #2563eb;
            --accent-purple: #9333ea;
            --success-text: #16a34a;
            --error-text: #dc2626;
            --warning-text: #d97706;
            --input-bg: rgba(255, 255, 255, 0.7);
            --input-focus-bg: rgba(255, 255, 255, 0.9);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .shell {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
        }

        header > div {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .brand {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--accent-primary);
        }

        main > h1 {
            text-align: center;
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--accent-light), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            margin-bottom: 2rem;
            color: var(--text-muted);
            font-size: 1rem;
            text-align: center;
        }

        .messages {
            margin-bottom: 2rem;
        }

        .message {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            border-left: 4px solid var(--accent-primary);
            background: rgba(59, 130, 246, 0.1);
            color: var(--text-secondary);
        }

        .message.success {
            border-color: var(--success-text);
            color: var(--success-text);
            background: rgba(74, 222, 128, 0.1);
        }

        .message.error {
            border-color: var(--error-text);
            color: var(--error-text);
            background: rgba(239, 68, 68, 0.1);
        }

        .message.warning {
            border-color: var(--warning-text);
            color: var(--warning-text);
            background: rgba(245, 158, 11, 0.1);
        }

        .tool {
            padding: 2.5rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        .grid,
        .type-panel {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1.5rem;
        }

        .field {
            min-width: 0;
        }

        .field.full,
        .type-panel {
            grid-column: 1 / -1;
        }

        .type-panel {
            padding-top: 0.5rem;
        }

        .type-panel[hidden] {
            display: none;
        }

        label {
            display: block;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
            font-weight: 500;
        }

        input,
        select,
        textarea {
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem;
            color: var(--text-primary);
            background: var(--input-bg);
            font: inherit;
        }

        input,
        select {
            min-height: 42px;
        }

        textarea {
            min-height: 132px;
            resize: vertical;
            font-family: monospace;
            font-size: 0.84rem;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
            background: var(--input-focus-bg);
        }

        .actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .button,
        button {
            flex: 1;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font: inherit;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
        }

        .button:hover,
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .button.secondary {
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent-light);
            border: 1px solid var(--accent-primary);
        }

        .button.secondary:hover {
            background: rgba(59, 130, 246, 0.2);
            box-shadow: none;
        }

        @media (max-width: 768px) {
            .shell {
                padding: 1.25rem;
            }

            header,
            header > div {
                align-items: flex-start;
                flex-direction: column;
            }

            main > h1 {
                font-size: 2rem;
            }

            .tool {
                padding: 1.5rem;
            }

            .grid,
            .type-panel {
                grid-template-columns: 1fr;
            }

            .actions {
                flex-direction: column;
            }
        }
    </style>
    <link rel="stylesheet" href="/static/css/app-theme.css">
</head>
<body class="theme-{{ user_theme }}">
    <div class="shell">
        <header>
            <div>
                <a class="brand" href="{% url 'portfolio' %}">DeFi Tome</a>
                <div><a class="back-link" href="{% url 'address_metadata_tag_list' %}">Back to Address Profiles</a></div>
            </div>
        </header>
        <main>
            <h1>Create Address Profile</h1>
            <p class="subtitle">Public metadata and ownership proofs for an address</p>

            {% if messages %}
            <div class="messages" aria-live="polite">
                {% for message in messages %}
                <div class="message {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}

            <form class="tool" method="post" novalidate>
                {% csrf_token %}
                <div class="grid">
                    <div class="field">
                        <label for="main-asset">Main asset</label>
                        <input id="main-asset" name="main_asset" maxlength="10" pattern="[A-Za-z0-9._]{3,10}" required>
                    </div>
                    <div class="field">
                        <label for="target-address">Tagged address</label>
                        <select id="target-address" name="target_address" required>
                            {% for address in controlled_addresses %}
                            <option value="{{ address }}">{{ address }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="field">
                        <label for="tag-type">Profile type</label>
                        <select id="tag-type" name="tag_type" required>
                            <option value="ANT">Address name (ANT)</option>
                            <option value="PGP">Encryption key (PGP)</option>
                            <option value="AIT">Identity record (AIT)</option>
                            <option value="CUSTOM">Custom</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="revision">Revision suffix</label>
                        <input id="revision" name="revision" maxlength="7" pattern="[A-Za-z0-9]{0,7}">
                    </div>

                    <div class="type-panel" data-type-panel="ANT">
                        <div class="field">
                            <label for="address-name">Address name</label>
                            <input id="address-name" name="address_name" maxlength="256">
                        </div>
                        <div class="field">
                            <label for="address-name-mime">Name MIME type</label>
                            <input id="address-name-mime" name="address_name_mime" value="text/x-markdown; charset=UTF-8" maxlength="128">
                        </div>
                        <div class="field full">
                            <label for="icon">Icon (base64 PNG)</label>
                            <textarea id="icon" name="icon" maxlength="131072"></textarea>
                        </div>
                    </div>

                    <div class="type-panel" data-type-panel="PGP" hidden>
                        <div class="field full">
                            <label for="pgp-public-key">PGP public key</label>
                            <textarea id="pgp-public-key" name="pgp_public_key" maxlength="65536"></textarea>
                        </div>
                    </div>

                    <div class="type-panel" data-type-panel="AIT" hidden>
                        <div class="field">
                            <label for="identity-algorithm">Encryption algorithm</label>
                            <input id="identity-algorithm" name="identity_algorithm" maxlength="128">
                        </div>
                        <div class="field">
                            <label for="identity-document">Encrypted document CID</label>
                            <input id="identity-document" name="identity_document" maxlength="255">
                        </div>
                    </div>

                    <div class="type-panel" data-type-panel="CUSTOM" hidden>
                        <div class="field">
                            <label for="custom-tag-type">Custom tag identifier</label>
                            <input id="custom-tag-type" name="custom_tag_type" maxlength="3" pattern="[A-Za-z]{3}">
                        </div>
                        <div class="field full">
                            <label for="custom-metadata">Custom metadata JSON</label>
                            <textarea id="custom-metadata" name="custom_metadata" maxlength="65536"></textarea>
                        </div>
                    </div>
                </div>
                <div class="actions">
                    <a class="button secondary" href="{% url 'address_metadata_tag_list' %}">Cancel</a>
                    <button type="submit">Create profile</button>
                </div>
            </form>
        </main>
    </div>
    <script>
        const tagType = document.getElementById('tag-type');
        const panels = document.querySelectorAll('[data-type-panel]');

        function setActivePanel() {
            panels.forEach((panel) => {
                const isActive = panel.dataset.typePanel === tagType.value;
                panel.hidden = !isActive;
                panel.querySelectorAll('input, textarea').forEach((field) => {
                    field.disabled = !isActive;
                });
            });
        }

        tagType.addEventListener('change', setActivePanel);
        setActivePanel();
    </script>
</body>
</html>
